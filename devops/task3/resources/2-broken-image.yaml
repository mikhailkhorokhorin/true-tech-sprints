apiVersion: apps/v1
kind: Deployment
metadata:
  name: nginx-broken-image
spec:
  replicas: 1
  selector:
    matchLabels:
      app: nginx-broken-image
  template:
    metadata:
      labels:
        app: nginx-broken-image
    spec:
      containers:
        - name: nginx
          image: nginx:1.23-absent-error
          imagePullPolicy: Always
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
