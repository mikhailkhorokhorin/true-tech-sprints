apiVersion: apps/v1
kind: Deployment
metadata:
  name: failed-readiness-probe
spec:
  replicas: 1
  selector:
    matchLabels:
      app: failed-readiness-probe
  template:
    metadata:
      labels:
        app: failed-readiness-probe
    spec:
      containers:
        - name: app
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
          readinessProbe:
            httpGet:
              path: /ready
              port: 80
            initialDelaySeconds: 2
            periodSeconds: 5
            failureThreshold: 3
