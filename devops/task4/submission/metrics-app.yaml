apiVersion: apps/v1
kind: Deployment
metadata:
  name: metrics-app
  labels:
    app.kubernetes.io/name: metrics-app
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: metrics-app
  template:
    metadata:
      labels:
        app.kubernetes.io/name: metrics-app
    spec:
      containers:
        - name: podinfo
          image: stefanprodan/podinfo:6.7.1
          ports:
            - name: http
              containerPort: 9898
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 128Mi
          readinessProbe:
            httpGet:
              path: /readyz
              port: http
            initialDelaySeconds: 2
            periodSeconds: 5
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: metrics-app
  labels:
    app.kubernetes.io/name: metrics-app
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: metrics-app
  ports:
    - name: http
      port: 9898
      targetPort: http
