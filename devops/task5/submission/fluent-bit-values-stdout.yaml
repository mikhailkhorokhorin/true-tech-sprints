kind: DaemonSet
rbac:
  create: false
  nodeAccess: false
serviceAccount:
  create: true
config:
  service: |
    [SERVICE]
        Daemon Off
        Flush 1
        Log_Level info
        Parsers_File /fluent-bit/etc/parsers.conf
        Parsers_File /fluent-bit/etc/conf/custom_parsers.conf
        HTTP_Server On
        HTTP_Listen 0.0.0.0
        HTTP_Port 2020
        Health_Check On
  inputs: |
    [INPUT]
        Name tail
        Path /var/log/containers/*log-demo-app*.log
        multiline.parser cri
        Tag kube.*
        Mem_Buf_Limit 50MB
        Skip_Long_Lines On
        Refresh_Interval 5
  filters: |
    [FILTER]
        Name parser
        Match kube.*
        Parser nginx_custom
        Key_Name log
        Preserve_Key True
        Reserve_Data True
  outputs: |
    [OUTPUT]
        Name stdout
        Match *
        Format json_lines
  customParsers: |
    [PARSER]
        Name nginx_custom
        Format regex
        Regex ^(?<remote>[^ ]*) - (?<user>[^ ]*) \[(?<time>[^\]]*)\] "(?<method>[A-Z]+) (?<url>[^ ]*) (?<protocol>[^\"]*)" (?<status>[0-9]{3}) (?<size>[0-9]+)
