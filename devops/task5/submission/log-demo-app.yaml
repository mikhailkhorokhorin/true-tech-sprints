apiVersion: apps/v1
kind: Deployment
metadata:
  name: log-demo-app
  annotations:
    log-parser: nginx_custom
spec:
  replicas: 1
  selector:
    matchLabels:
      app: log-demo-app
  template:
    metadata:
      labels:
        app: log-demo-app
      annotations:
        log-parser: nginx_custom
    spec:
      containers:
        - name: nginx
          image: nginx:1.25-alpine
          ports:
            - containerPort: 80
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
