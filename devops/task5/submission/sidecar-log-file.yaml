apiVersion: apps/v1
kind: Deployment
metadata:
  name: sidecar-log-demo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: sidecar-log-demo
  template:
    metadata:
      labels:
        app: sidecar-log-demo
    spec:
      volumes:
        - name: log-volume
          emptyDir: {}
      containers:
        - name: app
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              while true; do
                echo "$(date -Iseconds) INFO sidecar-demo: tick" >> /var/log/app.log
                sleep 5
              done
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: log-volume
              mountPath: /var/log
        - name: log-reader
          image: busybox:1.36
          command:
            - /bin/sh
            - -c
            - |
              touch /var/log/app.log
              tail -F /var/log/app.log
          resources:
            requests:
              cpu: 20m
              memory: 32Mi
          volumeMounts:
            - name: log-volume
              mountPath: /var/log
